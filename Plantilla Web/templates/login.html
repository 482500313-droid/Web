{% extends "base.html" %}
{% block titulo %}Iniciar Sesión{% endblock %}

{% block contenido %}
<div class="tarjeta-form">

  <h1 class="form-titulo">Iniciar Sesión</h1>

  <form method="POST">

    <div class="form-grupo">
      <label for="correo"></label>
      <input type="email" id="correo" name="correo"
             placeholder="Usuario@correo.com" required autofocus>
    </div>

    <div class="form-grupo">
      <label for="contrasena"></label>
      <input type="password" id="contrasena" name="contrasena"
             placeholder="Contraseña" required>
    </div>

    <button type="submit" class="btn btn-primario">Entrar</button>
  </form>

  <!-- Separador para Google -->
  <hr style="margin:1.2rem 0;border-color:var(--color-borde);">

  <a href="{{ url_for('google.login') }}" class="btn btn-secundario"
     style="display:block;text-align:center;">
    🔵 Entrar con Google
  </a>

  <p class="form-pie">
    ¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate</a>
  </p>

</div>
{% endblock %}

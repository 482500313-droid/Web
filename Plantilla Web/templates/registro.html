{% extends "base.html" %}
{% block titulo %}Registro{% endblock %}

{% block contenido %}
<div class="tarjeta-form">

  <h1 class="form-titulo">Crear Cuenta</h1>

  <form method="POST">

    <div class="form-grupo">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre"
             placeholder="Tu nombre" required autofocus>
    </div>

    <div class="form-grupo">
      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" name="correo"
             placeholder="tu@correo.com" required>
    </div>

    <div class="form-grupo">
      <label for="nombre">Numero</label>
      <input type="text" id="nombre" name="nombre"
             placeholder="Tu nombre" required autofocus>
    </div>

    <div class="form-grupo">
      <label for="contrasena">Contraseña (mínimo 6 caracteres)</label>
      <input type="password" id="contrasena" name="contrasena"
             placeholder="••••••••" required minlength="6">
    </div>

    <div class="form-grupo">
      <label for="confirmar">Confirmar contraseña</label>
      <input type="password" id="confirmar" name="confirmar"
             placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn btn-primario">Registrarme</button>
  </form>

  <p class="form-pie">
    ¿Ya tienes cuenta? <a href="{{ url_for('iniciar_sesion') }}">Inicia sesión</a>
  </p>

</div>
{% endblock %}
